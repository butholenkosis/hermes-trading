# Local PostgreSQL 16 with the pgvector extension available (needed later for DocChunk).
# Start:  docker compose up -d     (run from backend_django/)
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hermes_postgres
    environment:
      POSTGRES_DB: hermes_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hermes_pgdata:/var/lib/postgresql/data

volumes:
  hermes_pgdata:
